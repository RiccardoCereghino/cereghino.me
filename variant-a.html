<style>
  :root{
    --bg:#0a0b0d;
    --dot:#2e3542;
    --fg:#e8ebee;
    --muted:#a3aeb9;
    --link:#cfd8e0;
    --rule:#20252d;
    --accent:#5ee0c8;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    padding:clamp(1.5rem,6vw,5rem);
    overflow-x:hidden;
    background:var(--bg);
    color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- background: two dot grids drifting against each other ---- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg::before,.bg::after{
    content:"";
    position:absolute;
    top:-50%;left:-50%;
    width:200%;height:200%;
    background-image:radial-gradient(var(--dot) 1px,transparent 1.7px);
    will-change:transform;
  }
  /* Each grid travels an exact multiple of its own cell size, so the loop is seamless. */
  .bg::before{background-size:26px 26px;animation:driftA 60s linear infinite}
  .bg::after{background-size:34px 34px;opacity:.55;animation:driftB 104s linear infinite}
  @keyframes driftA{from{transform:translate3d(0,0,0)}to{transform:translate3d(130px,130px,0)}}
  @keyframes driftB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-136px,136px,0)}}

  /* Darkens hard right under the text, lets the grid breathe in a ring around it,
     then falls back to flat base at the edges. */
  .veil{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(ellipse 46% 42% at 30% 50%,rgba(10,11,13,.82) 0%,rgba(10,11,13,0) 100%),
      radial-gradient(ellipse 88% 78% at 34% 48%,rgba(10,11,13,0) 38%,var(--bg) 92%);
  }

  main{position:relative;z-index:2;max-width:58ch}

  .mark{
    width:2rem;height:2px;
    background:var(--accent);
    border-radius:2px;
    margin-bottom:1.75rem;
  }

  h1{
    /* 10ch forces the break after "Riccardo" at every width, so the two-line
       lockup is deliberate rather than a side effect of the viewport. */
    max-width:10ch;
    margin:0;
    font-size:clamp(2rem,8.6vw,4rem);
    font-weight:600;
    letter-spacing:-.045em;
    line-height:1.05;
    color:var(--fg);
  }

  .tagline{
    margin:1.35rem 0 0;
    max-width:44ch;
    font-size:clamp(.875rem,2.6vw,1.0625rem);
    line-height:1.75;
    color:var(--muted);
    text-wrap:pretty;
  }

  nav{
    display:flex;
    flex-wrap:wrap;
    gap:.25rem 1.75rem;
    margin-top:2.25rem;
    padding-top:1.5rem;
    border-top:1px solid var(--rule);
  }
  nav a{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    min-height:44px;
    padding:.55rem 0;
    color:var(--link);
    font-size:.9375rem;
    text-decoration:none;
    border-bottom:1px solid var(--rule);
    transition:color .18s ease,border-color .18s ease;
  }
  nav a svg{width:18px;height:18px;flex:none}
  nav a:hover,nav a:focus-visible{color:var(--accent);border-bottom-color:var(--accent)}
  nav a:focus-visible{outline:2px solid var(--accent);outline-offset:5px;border-radius:2px}

  /* On narrow screens the text fills the width, so the darkened pool has to
     span it rather than sitting in a column on the left. */
  @media (max-width:40rem){
    .veil{
      background:
        radial-gradient(ellipse 125% 34% at 50% 50%,rgba(10,11,13,.88) 0%,rgba(10,11,13,0) 100%),
        radial-gradient(ellipse 150% 100% at 50% 50%,rgba(10,11,13,0) 42%,var(--bg) 98%);
    }
  }

  @media (prefers-reduced-motion:reduce){
    .bg::before,.bg::after{animation:none}
    nav a{transition:none}
  }
</style>
</head>
<body>

<div class="veil" aria-hidden="true"></div>

<main>
