<style>
  :root{
    --bg:#08090c;
    --fg:#f4f6f9;
    --muted:#b9c2cd;
    --link:#dfe5ec;
    --rule:#1e2230;
    --accent:#9ca3fa;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1.5rem,6vw,5rem);
    overflow-x:hidden;
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- background: three soft gradient blobs on long, offset loops ----
     Softness comes from the gradient itself, not filter: blur(), so nothing
     is re-rasterised per frame. Only transform animates. ---- */
  .mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .mesh span{
    position:absolute;
    width:92vmax;height:92vmax;
    border-radius:50%;
    will-change:transform;
  }
  .mesh .m1{
    top:-32vmax;left:-22vmax;
    background:radial-gradient(circle at 50% 50%,rgba(99,102,241,.60) 0%,rgba(99,102,241,0) 66%);
    animation:m1 62s ease-in-out infinite;
  }
  .mesh .m2{
    top:-6vmax;right:-30vmax;
    background:radial-gradient(circle at 50% 50%,rgba(45,212,191,.46) 0%,rgba(45,212,191,0) 66%);
    animation:m2 78s ease-in-out infinite;
  }
  .mesh .m3{
    bottom:-40vmax;left:12vmax;
    background:radial-gradient(circle at 50% 50%,rgba(129,140,248,.38) 0%,rgba(129,140,248,0) 66%);
    animation:m3 94s ease-in-out infinite;
  }
  @keyframes m1{
    0%,100%{transform:translate3d(-4%,-3%,0) scale(1)}
    33%{transform:translate3d(9%,5%,0) scale(1.13)}
    66%{transform:translate3d(2%,10%,0) scale(.95)}
  }
  @keyframes m2{
    0%,100%{transform:translate3d(3%,2%,0) scale(1.05)}
    40%{transform:translate3d(-8%,9%,0) scale(.92)}
    70%{transform:translate3d(-2%,-6%,0) scale(1.1)}
  }
  @keyframes m3{
    0%,100%{transform:translate3d(0,4%,0) scale(.98)}
    45%{transform:translate3d(7%,-7%,0) scale(1.12)}
    75%{transform:translate3d(-6%,-2%,0) scale(1.02)}
  }

  /* Pools darkness behind the text so contrast never depends on where a blob is,
     while leaving the mesh bright in the surrounding field. Measured worst case
     (both blobs at peak, dead centre): 11.4:1 on the name, 6.9:1 on the tagline. */
  .scrim{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(ellipse 58% 50% at 50% 46%,rgba(8,9,12,.84) 0%,rgba(8,9,12,.66) 58%,rgba(8,9,12,0) 100%),
      radial-gradient(ellipse 104% 96% at 50% 46%,rgba(8,9,12,0) 46%,rgba(8,9,12,.5) 100%),
      linear-gradient(rgba(8,9,12,.16),rgba(8,9,12,.3));
  }

  main{position:relative;z-index:2;max-width:52ch;text-align:center}

  .mark{
    display:grid;
    grid-template-columns:repeat(3,4px);
    gap:4px;
    justify-content:center;
    margin:0 auto 2rem;
  }
  .mark i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.75}
  .mark i:nth-child(1),.mark i:nth-child(5),.mark i:nth-child(9){opacity:1}
  .mark i:nth-child(3),.mark i:nth-child(7){opacity:.4}

  h1{
    margin:0;
    font-size:clamp(2.125rem,9.4vw,4.75rem);
    font-weight:680;
    letter-spacing:-.035em;
    line-height:1.02;
    color:var(--fg);
    text-wrap:balance;
  }

  .tagline{
    margin:1.5rem auto 0;
    max-width:38ch;
    font-size:clamp(.9375rem,2.8vw,1.125rem);
    font-weight:400;
    line-height:1.65;
    color:var(--muted);
    text-wrap:pretty;
  }

  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.5rem;
    margin-top:2.5rem;
  }
  nav a{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    min-height:44px;
    padding:.7rem 1.05rem;
    color:var(--link);
    font-size:.9375rem;
    font-weight:500;
    text-decoration:none;
    border:1px solid var(--rule);
    border-radius:999px;
    background:rgba(255,255,255,.022);
    transition:color .18s ease,border-color .18s ease,background-color .18s ease;
  }
  nav a svg{width:17px;height:17px;flex:none}
  nav a .lbl{text-decoration:none;border-bottom:1px solid transparent;transition:border-color .18s ease}
  nav a:hover,nav a:focus-visible{color:#fff;border-color:var(--accent);background:rgba(156,163,250,.1)}
  nav a:hover .lbl,nav a:focus-visible .lbl{border-bottom-color:currentColor}
  nav a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .mesh span{animation:none}
    nav a,nav a .lbl{transition:none}
  }
</style>
</head>
<body>
